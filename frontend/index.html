<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-state="idle">
    <canvas id="orb-canvas"></canvas>
    <div id="titlebar"></div>

    <!-- Minimal controls — top right -->
    <div id="controls">
      <input type="range" id="volume" min="0" max="100" value="100" title="JARVIS volume" aria-label="JARVIS volume" />
      <button id="btn-mute" title="Mute/Unmute">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button id="btn-pause" title="Pause JARVIS (frees CPU, memory and GPU)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/>
        </svg>
      </button>
      <button id="btn-menu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
      <button id="btn-close" title="Hide to tray (JARVIS keeps listening)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Dropdown menu -->
    <div id="menu-dropdown" style="display:none">
      <button id="btn-settings">Settings</button>
      <button id="btn-restart">Restart Server</button>
      <button id="btn-fix-self">Fix Yourself</button>
    </div>

    <aside id="panel-sys" class="panel">
      <h4>Systems</h4>
      <div class="gauge" id="g-cpu"><span>CPU</span><b>--</b><i></i></div>
      <div class="gauge" id="g-ram"><span>Memory</span><b>--</b><i></i></div>
      <div class="gauge" id="g-gpu"><span>Graphics</span><b>--</b><i></i></div>
      <div class="gauge" id="g-vram"><span>Video memory</span><b>--</b><i></i></div>
    </aside>

    <aside id="panel-log" class="panel">
      <h4>Comms</h4>
      <div id="log"><p class="log-empty">Say &ldquo;Jarvis&rdquo; to begin.</p></div>
    </aside>

    <div id="state-word">standby</div>
    <div id="status-text"></div>
    <div id="jarvis-label">J.A.R.V.I.S<span id="hud-clock"></span></div>
    <div id="error-text"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
